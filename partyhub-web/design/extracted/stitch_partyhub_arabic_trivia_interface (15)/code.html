<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/70 backdrop-blur-xl transition-all duration-300 ease-in-out flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-3">

<span class="material-symbols-outlined">notifications</span>
</button>

<!-- Main Content Canvas -->

<!-- Question Card -->

<div class="absolute -right-10 -top-10 w-32 h-32 bg-primary-container/20 rounded-full blur-2xl"></div>
<div class="flex justify-between items-center relative z-10">
<div class="bg-tertiary-container/30 text-on-tertiary-container px-3 py-1 rounded-full font-label-sm text-label-sm">
                    الجولة ٣ - رياضة
                </div>
<div class="flex items-center gap-1 text-primary-fixed-dim">
<span class="material-symbols-outlined text-[20px]">timer</span>
<span class="font-headline-md text-headline-md">00:15</span>
</div>
</div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface text-center mt-4 mb-2 relative z-10">
                من هو الهداف التاريخي لكأس العالم؟
            </h2>
<div class="bg-surface-container/50 rounded-xl p-4 mt-2 border border-surface-container-highest text-center">
<p class="font-body-lg text-body-lg text-on-surface-variant">الإجابة الصحيحة:</p>
<p class="font-headline-md text-headline-md text-primary mt-1">ميروسلاف كلوزه (١٦ هدف)</p>
</div>
</section>

<img class="w-14 h-14 rounded-full object-cover border-4 border-primary shadow-[0_0_15px_rgba(56,189,248,0.4)]" data-alt="A portrait photo of a young man smiling energetically, serving as a player avatar in a trivia game interface. Soft lighting, modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgTwCAvgoXyCMLxs1kbJ97yKGwx7fTqsu2tbEZ0BYe9Z8isZJMJvqNwOSi4N4qbq_skwilz-oAZfuUBztEWIe-LlcJtPYQnKi6wlQAuZYQOCfEG8q8hCMK0lZFOzlqHLgsyP50Dt5NX6fsN0XOYU_egwvQOyyYTCNBlTa8u4oa19sM4OUqulyrfcvabZYli9MyhLbvL1jW83Fqxe6Z4U05iXCg5ul15YvOgofiCMkdtkusEu3kkHA4"/>

</div>
</div>
<div class="flex-grow">
<p class="font-label-sm text-label-sm text-on-surface-variant">يجيب الآن</p>
<h3 class="font-headline-md text-headline-md text-on-surface">أحمد السعيد</h3>
</div>
</section>

<section class="grid grid-cols-2 gap-4">
<button class="bg-secondary-container hover:bg-secondary-fixed text-on-secondary-container rounded-xl py-4 flex flex-col items-center justify-center gap-2 transition-all duration-200 hover:scale-[1.02] active:scale-95 shadow-sm border border-secondary/10">

<span class="font-headline-md text-headline-md">صح +١</span>
</button>
<button class="bg-error-container hover:bg-error/20 text-on-error-container rounded-xl py-4 flex flex-col items-center justify-center gap-2 transition-all duration-200 hover:scale-[1.02] active:scale-95 shadow-sm border border-error/10">
<span class="material-symbols-outlined text-[32px]">cancel</span>
<span class="font-headline-md text-headline-md">خطأ -١</span>
</button>

<span class="material-symbols-outlined">replay</span>
<span class="font-headline-md text-headline-md">إعادة Buzz</span>
</button>

<div class="flex flex-col gap-3">

</div>
<div class="bg-primary-container/20 text-primary-fixed-dim px-3 py-1 rounded-full font-label-sm text-label-sm font-bold">

                    </div>
</div>

<div class="flex items-center gap-3 p-3 bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-sm opacity-80">

<img class="w-10 h-10 rounded-full object-cover grayscale-[20%]" data-alt="A portrait photo of a young woman with a casual style, serving as a player avatar in a lighthearted trivia game. Bright, inviting lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjMpJlgJC_TfI9J5QpLG84B5BLt3C39SqlVYkpHAPKqgSYGZKk2j830bwdywz0qAdhahAxlGh9j_v9GXQdaDIYUu2GLpwAFhxgP5gs8LmxZxi8Uk9hAJcDiVkLXgPCoNMefU7rjwx9nXU_-Pn3G_yGrlCzSLbqhZHaAkQreJXrpgzDTbjLiP8v4aihCEVh0DUu-G1_I4islbx_z-w6a_z1_YHf7rez03HJ0Jj0EpMIYSD8A5MISIfn"/>

<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1.5 shadow-[0_10px_15px_-3px_rgba(56,189,248,0.2)] scale-105 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
<span class="font-label-sm text-label-sm mt-1">Play</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1.5 hover:text-primary transition-all duration-200">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-label-sm text-label-sm mt-1">Rankings</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1.5 hover:text-primary transition-all duration-200">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
