<script>
        // Simple timer animation script
        document.addEventListener("DOMContentLoaded", () => {
            const timerBar = document.getElementById('timer-bar');
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = 4.2;
            const totalTime = 5.0;

            const interval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(interval);
                    timerBar.style.width = '0%';
                    timerDisplay.textContent = '0.0ث';
                    // Change color to error when done or low
                } else {
                    const percentage = (timeLeft / totalTime) * 100;
                    timerBar.style.width = percentage + '%';
                    timerDisplay.textContent = timeLeft.toFixed(1) + 'ث';
                    
                    if (timeLeft < 1.5) {
                        timerBar.classList.remove('bg-secondary-container');
                        timerBar.classList.add('bg-error-container');
                        timerDisplay.classList.remove('text-primary');
                        timerDisplay.classList.add('text-error');
                    }
                }
            }, 100);
        });
    </script>
