<script>
        // Simple countdown logic for the progress bar
        document.addEventListener("DOMContentLoaded", () => {
            const bar = document.getElementById('countdown-bar');
            let timeLeft = 5000; // 5 seconds
            const totalTime = 5000;
            const updateInterval = 50; // update every 50ms

            const timer = setInterval(() => {
                timeLeft -= updateInterval;
                const percentage = (timeLeft / totalTime) * 100;
                bar.style.width = `${Math.max(0, percentage)}%`;

                if (timeLeft <= 1000) {
                     bar.classList.remove('bg-secondary-fixed');
                     bar.classList.add('bg-error'); // Transition to alert color
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    // Handle time up logic here
                }
            }, updateInterval);
        });
    </script>
